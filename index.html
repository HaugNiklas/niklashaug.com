<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Niklas Haug</title>
  <meta name="robots" content="noindex">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f6f5f2;
      color: #1d1d1f;
      padding: 24px;
    }
    main { text-align: center; max-width: 480px; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 700; letter-spacing: -0.02em; }
    p { margin-top: 12px; font-size: 1.1rem; color: #6e6e73; }
    .dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      background: #e8a33d; margin-right: 8px; vertical-align: middle;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #f5f5f7; }
      p { color: #a1a1a6; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Niklas Haug</h1>
    <p><span class="dot"></span>Diese Seite ist im Aufbau.</p>
  </main>
</body>
</html>
